<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="A plan of the Last Lantern: the taproom, the cellar door and the cellar">
  <!-- The starter adventure's map, drawn by hand: replace it with your own. Any wide picture will do
       (an .svg like this one, or a .webp). A region in adventure.js is a rectangle over the picture, in
       percentages of its width and height. The three here are:
         taproom   x 2   y 6   w 52  h 88
         door      x 54  y 30  w 14  h 40
         cellar    x 68  y 6   w 30  h 88   -->
  <rect width="1200" height="600" fill="#17100b"/>

  <!-- the taproom: floorboards, the hearth, the bar and three tables -->
  <rect x="40" y="50" width="600" height="500" rx="12" fill="#e8d6b0" stroke="#4a3418" stroke-width="12"/>
  <g stroke="#c9b48a" stroke-width="3">
    <path d="M52 130H628M52 210H628M52 290H628M52 370H628M52 450H628"/>
  </g>
  <rect x="46" y="230" width="46" height="140" fill="#4a3418"/>
  <path d="M58 340q-8-38 12-58q-4 26 12 30q-6-22 6-36q14 30 4 64z" fill="#c8102e"/>
  <path d="M66 340q-4-20 8-30q0 14 8 16q0 12-6 14z" fill="#f2b84b"/>
  <rect x="330" y="64" width="290" height="46" rx="6" fill="#8a6a3a" stroke="#4a3418" stroke-width="5"/>
  <g fill="#b9743a" stroke="#4a3418" stroke-width="5">
    <circle cx="210" cy="190" r="48"/><circle cx="430" cy="300" r="48"/><circle cx="240" cy="430" r="48"/>
  </g>
  <g fill="#4a3418">
    <circle cx="140" cy="170" r="13"/><circle cx="270" cy="150" r="13"/><circle cx="230" cy="262" r="13"/>
    <circle cx="372" cy="250" r="13"/><circle cx="498" cy="318" r="13"/><circle cx="410" cy="372" r="13"/>
    <circle cx="170" cy="420" r="13"/><circle cx="296" cy="470" r="13"/><circle cx="250" cy="358" r="13"/>
  </g>
  <rect x="300" y="538" width="90" height="18" fill="#8a6a3a"/>

  <!-- the passage, and the cellar door across it -->
  <rect x="640" y="250" width="180" height="100" fill="#cdb98e" stroke="#4a3418" stroke-width="12"/>
  <rect x="634" y="262" width="12" height="76" fill="#cdb98e"/>
  <rect x="722" y="244" width="18" height="112" rx="4" fill="#6b170f" stroke="#2a1b10" stroke-width="4"/>
  <circle cx="731" cy="300" r="7" fill="#c9a45c"/>

  <!-- the cellar: steps down, barrels, turnip sacks, and something glowing behind them -->
  <rect x="820" y="50" width="340" height="500" rx="12" fill="#6f6252" stroke="#2a1b10" stroke-width="12"/>
  <g stroke="#2a1b10" stroke-width="5"><path d="M832 262V338M852 262V338M872 262V338M892 262V338"/></g>
  <g fill="#8a6a3a" stroke="#2a1b10" stroke-width="5">
    <circle cx="900" cy="120" r="40"/><circle cx="990" cy="110" r="40"/><circle cx="1080" cy="124" r="40"/><circle cx="1100" cy="210" r="40"/>
  </g>
  <circle cx="1040" cy="436" r="74" fill="#f2b84b" opacity="0.28"/>
  <circle cx="1040" cy="436" r="34" fill="#ffe7a6" opacity="0.5"/>
  <g fill="#b9a88a" stroke="#2a1b10" stroke-width="5">
    <ellipse cx="960" cy="470" rx="52" ry="38"/><ellipse cx="1090" cy="486" rx="52" ry="38"/><ellipse cx="1026" cy="412" rx="50" ry="36"/>
  </g>
</svg>
